<!DOCTYPE html><html><head><meta charset="utf-8"><title>selftest</title></head>
<body><pre id="out">running</pre>
<script type="module">
import { GameClock } from './js/timer.js';
import { loadBuild, loadManifest, prepareBuild, formatClock, formatDrift, villagersAt, stepIndexAt, parseClock } from './js/data.js';
const lines = []; let fails = 0;
const ok = (name, cond, extra='') => { lines.push(`${cond?'PASS':'FAIL'}  ${name}${extra?'  '+extra:''}`); if(!cond) fails++; };
const near = (a,b,tol=0.08) => Math.abs(a-b) <= tol;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// --- clock ---------------------------------------------------------------
const c = new GameClock(1.7);
ok('clock starts at 0', c.gameSeconds === 0);
ok('clock not running before start', c.running === false);
c.start(); await sleep(300);
ok('1.7x ticks 1.7 game-sec per real sec', near(c.gameSeconds, 0.3*1.7, 0.12), `got ${c.gameSeconds.toFixed(3)} want ~0.51`);
c.pause(); const held = c.gameSeconds; await sleep(200);
ok('paused clock does not advance', c.gameSeconds === held);
c.start(); await sleep(200); c.pause();
const beforeSpeed = c.gameSeconds;
c.setSpeed(1.0);
ok('speed change does not move the clock', c.gameSeconds === beforeSpeed, `${beforeSpeed.toFixed(3)}`);
c.start(); await sleep(300); c.pause();
ok('1.0x ticks slower than 1.7x did', near(c.gameSeconds - beforeSpeed, 0.3, 0.12), `delta ${(c.gameSeconds-beforeSpeed).toFixed(3)}`);
c.seek(400);
ok('seek sets game time', c.gameSeconds === 400);
c.reset();
ok('reset returns to 0', c.gameSeconds === 0 && !c.running);

// speed change mid-run must also not jump
const c2 = new GameClock(1.0); c2.start(); await sleep(200);
const pre = c2.gameSeconds; c2.setSpeed(1.7); const post = c2.gameSeconds;
ok('mid-run speed change is continuous', Math.abs(post - pre) < 0.05, `${pre.toFixed(3)} -> ${post.toFixed(3)}`);
c2.pause();

// --- pure helpers --------------------------------------------------------
ok('formatClock pads seconds', formatClock(400) === '6:40', formatClock(400));
ok('formatClock 9:15', formatClock(555) === '9:15', formatClock(555));
ok('parseClock roundtrip', parseClock('9:15') === 555);
ok('parseClock rejects junk', (() => { try { parseClock('9:99'); return false; } catch { return true; } })());
ok('villagersAt(0) = 3', villagersAt(0) === 3);
ok('villagersAt(275) = 14', villagersAt(275) === 14);
ok('villagersAt(400) = 19', villagersAt(400) === 19);
ok('drift behind', formatDrift(14) === '14s behind', formatDrift(14));
ok('drift ahead', formatDrift(-30) === '30s ahead', formatDrift(-30));
ok('drift on time', formatDrift(1) === 'on time');
ok('drift over a minute', formatDrift(95) === '1m 35s behind', formatDrift(95));

// --- every build in the manifest ----------------------------------------
const manifest = await loadManifest();
ok('manifest lists 5 builds', manifest.length === 5, `${manifest.length}`);
const loaded = {};
for (const entry of manifest) {
  try {
    const b = await loadBuild(entry.id);
    loaded[entry.id] = b;
    // loadBuild throws on any invariant breach, so reaching here is the check
    ok(`${entry.id}: validates`, true, `${b.steps.length} steps, ends ${formatClock(b.duration)}`);
    ok(`${entry.id}: allocations sum to villager counts`,
       b.steps.every(s => Object.values(s.alloc).reduce((a,x)=>a+x,0) === s.vills));
    ok(`${entry.id}: timeline is monotonic`,
       b.steps.every((s,i) => i === 0 || s.time >= b.steps[i-1].time));
    ok(`${entry.id}: every step has a phase and an action`,
       b.steps.every(s => s.phase && s.action));
  } catch (e) {
    ok(`${entry.id}: validates`, false, e.message.split('\n').slice(0,2).join(' '));
  }
}

// --- drush timeline ------------------------------------------------------
const b = loaded['drush-into-scouts'];
ok('drush: 28 steps', b.steps.length === 28, `${b.steps.length}`);
ok('drush: first step at 0:00 with 3 vills', b.steps[0].time === 0 && b.steps[0].vills === 3);
ok('drush: first step label is a range', b.steps[0].label === 'Villagers 1–3', b.steps[0].label);
ok('drush: clicks up at 6:45 with 19 vills',
   formatClock(b.ages.clicks.feudal) === '6:45' && villagersAt(b.ages.clicks.feudal) === 19, formatClock(b.ages.clicks.feudal));
ok('drush: Feudal arrives 130s after the click', b.ages.arrivals.feudal - b.ages.clicks.feudal === 130);
ok('drush: stepIndexAt(275) lands on the Barracks', b.steps[stepIndexAt(b.steps, 275)].build === 'Barracks');
ok('drush: stepIndexAt past the end clamps', stepIndexAt(b.steps, 99999) === b.steps.length - 1);

// --- multi-age derivation, checked against the sources' own figures ------
const fi = loaded['fast-imperial-turks'];
ok('fast imp: Castle click 12:27 (video states 12:27)', formatClock(fi.ages.clicks.castle) === '12:27', formatClock(fi.ages.clicks.castle));
ok('fast imp: Imperial arrives 18:17 (video states ~18:00)', formatClock(fi.ages.arrivals.imperial) === '18:17', formatClock(fi.ages.arrivals.imperial));
ok('fast imp: Castle research is 160s', fi.ages.arrivals.castle - fi.ages.clicks.castle === 160);
ok('fast imp: Imperial research is 190s', fi.ages.arrivals.imperial - fi.ages.clicks.imperial === 190);
ok('fast imp: clicks Feudal with 23 vills', fi.steps.find(s => s.build === 'Click up').vills === 23);
const fc = loaded['fast-castle-knights'];
ok('fast castle: clicks Feudal with 24 vills', fc.steps.find(s => s.build === 'Click up').vills === 24);
ok('fast castle: 26 vills on arrival in Feudal',
   fc.steps.find(s => s.age === 'feudal' && s.offset == null).vills === 26);
ok('fast castle: Castle click is after Feudal arrival', fc.ages.clicks.castle > fc.ages.arrivals.feudal);

// --- validator rejects bad builds ---------------------------------------
const bad = (build, re) => { try { prepareBuild(build); return false; } catch (e) { return re.test(e.message); } };
ok('rejects bad allocation',
   bad({ id:'x', steps:[{ vill:4, action:'a', alloc:{food:99} }] }, /allocation totals 99/));
ok('rejects backwards timeline',
   bad({ id:'x', steps:[{ time:'5:00', vills:1, action:'a', alloc:{food:1} },{ time:'1:00', vills:1, action:'b', alloc:{food:1} }] }, /backwards in time/));
ok('rejects a post-click step with no explicit vills',
   bad({ id:'x', ages:[{ age:'feudal', at:{ vill:10 } }],
         steps:[{ vill:10, action:'click', alloc:{food:10} },
                { age:'feudal', action:'later', alloc:{food:10} }] }, /needs an explicit "vills"/));
const oneStep = [{ vill:4, action:'a', alloc:{ food:4 } }];
ok('rejects an unknown age', bad({ id:'x', ages:[{ age:'bronze', at:{ vill:4 } }], steps:oneStep }, /Unknown age/));
ok('rejects an age referenced before it is declared',
   bad({ id:'x', ages:[{ age:'castle', at:{ age:'feudal' } }], steps:oneStep }, /not declared before it/));
ok('rejects an unknown phase',
   bad({ id:'x', steps:[{ vill:4, phase:'stone-age', action:'a', alloc:{food:4} }] }, /unknown phase/));

// --- follow state (auto vs manual) ---------------------------------------
const { FollowState } = await import('./js/follow.js');

// the regression this module exists for: jumping BEHIND the clock must stick
{
  const f = new FollowState();
  f.resolve(10);                       // clock is on step 10
  f.goTo(7, 10);                       // player is really on step 7
  ok('jump behind the clock sticks', f.resolve(10) === 7, `got ${f.resolve(10)}`);
  ok('...still sticks as the clock runs on', f.resolve(12) === 7, `got ${f.resolve(12)}`);
  ok('...and reports manual', f.auto === false);
  f.follow(12);
  ok('Follow clock returns to auto', f.auto === true && f.resolve(12) === 12);
}
// jumping AHEAD hands control back once the clock catches up
{
  const f = new FollowState();
  f.resolve(5);
  f.goTo(7, 5);
  ok('jump ahead pins the step', f.resolve(5) === 7 && f.auto === false);
  ok('...holds while the clock is behind it', f.resolve(6) === 7);
  ok('...auto resumes when the clock arrives', f.resolve(7) === 7 && f.auto === true);
  ok('...and follows onward', f.resolve(9) === 9);
}
// jumping to the step the clock is already on is just "follow"
{
  const f = new FollowState();
  f.resolve(4);
  f.goTo(4, 4);
  ok('jump to the current step stays auto', f.auto === true && f.resolve(6) === 6);
}
// Prev from an auto position must not snap forward
{
  const f = new FollowState();
  const auto = 10;
  const shown = f.resolve(auto);
  f.goTo(shown - 1, auto);
  ok('Prev while auto goes back and stays', f.resolve(auto) === 9, `got ${f.resolve(auto)}`);
}

lines.push('', fails === 0 ? `ALL ${lines.filter(l=>l.startsWith('PASS')).length} CHECKS PASSED` : `${fails} FAILURES`);
document.getElementById('out').textContent = lines.join('\n');
</script></body></html>
